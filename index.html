<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#home" aria-label="مدار، الصفحة الرئيسية">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"></circle><circle cx="20" cy="20" r="6" fill="currentColor"></circle><circle cx="33" cy="12.5" r="3.4" class="brand-dot"></circle></svg>
      <span class="brand-name">مدار</span>
    </a>
    <nav class="side-nav" id="sideNav" aria-label="صفحات المنصة"></nav>
    <div class="sync" id="syncSide"></div>
  </aside>

  <div class="main" id="main">
    <header class="top">
      <a class="brand brand-sm" href="#home" aria-label="مدار، الصفحة الرئيسية">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"></circle><circle cx="20" cy="20" r="6" fill="currentColor"></circle><circle cx="33" cy="12.5" r="3.4" class="brand-dot"></circle></svg>
        <span class="brand-name">مدار</span>
      </a>
      <div class="top-date" id="topDate"></div>
      <a class="mini-timer" id="miniTimer" href="#focus" hidden></a>
      <span class="sync-dot" id="syncDot" title=""></span>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="صفحات المنصة"></nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" id="modalBox"></div>
</div>

<script src="js/content.js"></script>
<script src="js/outlines.js"></script>
<script src="js/app.js"></script>
</body>
</html>
